# Временный HTTP-only конфиг: нужен certbot'у, чтобы выпустить сертификат.
# После `certbot --nginx` его заменит nginx-liqscope.conf (уже с 443).
#
# Микрокэш API и отдача статики с диска здесь те же, что в основном конфиге:
# стенд без HTTPS тоже должен держать нагрузку, а не греть один воркер
# uvicorn на каждом запросе графика. Оба файла одновременно в sites-enabled
# не лежат (setup-https.sh перезаписывает sites-available/liqscope), поэтому
# зона API_CACHE объявлена в каждом из них и не конфликтует.

limit_conn_zone $binary_remote_addr zone=liq_ws:1m;

# Зона микрокэша API: 10 МБ ключей в памяти воркеров, тела в /tmp (100 МБ),
# неиспользуемое выбрасывается через минуту.
proxy_cache_path /tmp/nginx_api_cache levels=1:2 keys_zone=API_CACHE:10m
                 max_size=100m inactive=1m use_temp_path=off;

# Cache-Control статики с диска: ?v= — год и immutable, .js/.css/.json/.html
# без версии — час (i18n.pages.{lang}.js подставляется в HTML без ?v=),
# картинки и шрифты — 7 дней. Значения повторяют CachedStaticFiles в server.py.
map "$arg_v|$uri" $liq_static_cc {
    default                  "public, max-age=604800, no-transform";
    "~^[^|]+[|]"             "public, max-age=31536000, immutable, no-transform";
    "~^[|].*[.]js$"          "public, max-age=3600, no-transform";
    "~^[|].*[.]css$"         "public, max-age=3600, no-transform";
    "~^[|].*[.]json$"        "public, max-age=3600, no-transform";
    "~^[|].*[.]html$"        "public, max-age=3600, no-transform";
    "~^[|].*[.]webmanifest$" "public, max-age=3600, no-transform";
}

upstream liqscope_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name liqscope.online www.liqscope.online;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location /ws {
        limit_conn liq_ws 20;
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Свечи графика: микрокэш 3 с. add_header в location отменяет наследование
    # серверных заголовков — поэтому блок безопасности повторён, это не дубль.
    location = /api/klines {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # без gzip в Python: в кэш ложится несжатое тело, жмёт сам nginx
        proxy_set_header Accept-Encoding "";

        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # cookie-виджет аналитики в общий кэш попадать не должен
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Статистика и дайджесты: микрокэш 5 с. Ручки перечислены точно —
    # /api/digest/settings, /api/digest/run и /api/admin/* кэшировать нельзя.
    location ~ "^/api/(stats|leaders|digest|digest/today|digest/[0-9]{4}-[0-9]{2}-[0-9]{2})$" {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Статика с диска, минуя Python. Путь — WorkingDirectory юнита + /static;
    # setup-https.sh подставляет фактический каталог репозитория.
    # Права: chmod o+x /root /root/Licvid && chmod -R o+rX /root/Licvid/static
    # (иначе www-data получит 403). Файла нет — уходим в приложение.
    location /static/ {
        alias /root/Licvid/static/;
        access_log off;
        try_files $uri @static_app;
        add_header Cache-Control $liq_static_cc always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Запасной путь статики: приложение отдаст файл и поставит свой Cache-Control.
    location @static_app {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
