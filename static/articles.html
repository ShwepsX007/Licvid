<style>
.art-wrap { max-width: 1080px; margin: 0 auto; padding: 26px 22px 70px; }
.art-head { margin: 8px 0 20px; }
.art-head h1 { font-size: 1.9rem; line-height: 1.2; }
.art-lead { color: var(--muted); margin-top: 10px; max-width: 820px; line-height: 1.55; font-size: 0.95rem; }
.art-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.chip {
    font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border);
    background: rgba(13, 18, 32, 0.6); padding: 5px 10px; border-radius: 999px;
}
.chip b { color: var(--text); }
.chip.link { text-decoration: none; }
.chip.link:hover { border-color: rgba(0, 214, 255, 0.5); color: var(--text); }
.art-grid {
    display: grid; gap: 18px; margin-top: 6px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
}
.art-card {
    display: flex; flex-direction: column; border: 1px solid var(--border);
    background: rgba(13, 18, 32, 0.72); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit; transition: border-color 0.15s, transform 0.15s;
}
.art-card:hover { border-color: rgba(61, 112, 255, 0.55); transform: translateY(-2px); }
.art-card .ac-photo { width: 100%; height: 190px; object-fit: cover; display: block; background: rgba(7, 10, 16, 0.6); border-bottom: 1px solid var(--border); }
.art-card .ac-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.art-card .ac-date { color: var(--muted); font-size: 0.74rem; }
.art-card .ac-langs {
    display: inline-block; margin-left: 7px; padding: 1px 7px;
    border: 1px solid var(--border); border-radius: 999px;
    color: var(--muted); font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.5px; vertical-align: middle;
}
.art-card h2 { font-size: 1.05rem; line-height: 1.35; }
.art-card .ac-sum { color: var(--muted); font-size: 0.85rem; line-height: 1.55; flex: 1; }
.art-card .ac-more { color: var(--cyan); font-size: 0.8rem; }
.art-empty {
    border: 1px dashed var(--border); border-radius: 14px; padding: 30px 20px;
    text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.6;
}
.art-pager { display: flex; justify-content: center; margin-top: 20px; }
.art-pager button {
    border: 1px solid var(--border); background: rgba(13, 18, 32, 0.72); color: var(--text);
    border-radius: 10px; padding: 9px 18px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
}
.art-pager button:hover { border-color: rgba(61, 112, 255, 0.55); }
.partner-line { margin-top: 30px; font-size: 0.82rem; color: var(--muted); }
@media (max-width: 700px) { .art-wrap { padding: 20px 14px 60px; } .art-grid { grid-template-columns: 1fr; } }
</style>

<body data-page="articles">

<header class="site-header">
    <a class="brand" href="/">
        <img class="logo" src="/static/logo.png" alt="LiqScope" width="40" height="40" loading="eager">
        <span class="name">LIQSCOPE</span>
        <span class="tag">ARTICLES</span>
    </a>
    <nav class="site-nav">
        <select id="lang-select" class="lang-select" aria-label="Language / Язык" title="Language / Язык">
            <option value="ru">🇷🇺 Русский</option>
            <option value="en">🇬🇧 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="es">🇪🇸 Español</option>
        </select>
        <a class="btn btn-ghost btn-compact" href="/hourly">📊 <span data-i18n="art.to_hourly">Сводки по часам</span></a>
        <a class="btn btn-ghost btn-compact" href="/digest">📰 <span data-i18n="hour.digest">Дайджест</span></a>
        <a class="btn btn-ghost btn-compact" href="/terminal">⚡ <span data-i18n="hour.to_terminal">К терминалу</span></a>
        <span id="nav-account"></span>
    </nav>
</header>

<main class="art-wrap">
    <div class="art-head">
        <h1 data-i18n="art.title">Статьи</h1>
        <p class="art-lead" data-i18n="art.lead">Разборы рынка крипто-фьючерсов: как читать ликвидации, открытый интерес и объём — без воды и прогнозов.</p>
        <div class="art-chips">
            <span class="chip"><span data-i18n="art.total">Статей</span>: <b id="art-total">{{total}}</b></span>
            <span class="chip"><span data-i18n="art.fresh">Свежая</span>: <b id="art-fresh">{{fresh}}</b></span>
            {{channel}}
        </div>
    </div>

    <div id="ad-host" class="ad-host" data-ad-place="articles" hidden></div>

    <section id="art-list" class="art-grid">
        {{articles}}
    </section>
    <div class="art-pager hidden" id="art-pager">
        <button type="button" id="art-more" data-i18n="art.more">Показать ещё</button>
    </div>

    <p class="partner-line">
        <a href="https://www.gate.com/ru/signup/VLFCAVWMBW?ref_type=103" data-gate-ref
           target="_blank" rel="noopener sponsored" data-i18n="land.gate.link">
            💠 Торговать на Gate — скидка на комиссию
        </a>
    </p>
