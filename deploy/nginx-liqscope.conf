# LiqScope: снаружи 80/443, приложение на 127.0.0.1:8000.
# Ставится скриптом deploy/setup-https.sh.
#
# Что здесь снимает нагрузку с единственного воркера uvicorn:
#   1. микрокэш тяжёлых REST-ручек (proxy_cache + proxy_cache_lock) —
#      100 одновременных /api/klines дают ОДИН заход в Python;
#   2. статика напрямую с диска (alias) — app.js/i18n/картинки вообще не
#      доходят до приложения.
# Порядок важен: WebSocket (/ws) и мутирующие ручки не кэшируются вовсе.

# Зоны — в http-контексте (файл подключается из sites-enabled).
limit_conn_zone $binary_remote_addr zone=liq_ws:1m;
limit_req_zone $binary_remote_addr zone=liq_sym:10m rate=2r/s;

# Зона микрокэша API: 10 МБ ключей (это тысячи записей) в общей памяти
# воркеров, тела — в /tmp (100 МБ), неиспользуемое выбрасывается через минуту.
# use_temp_path=off — пишем сразу в каталог кэша, без лишнего копирования
# между разделами. Каталог nginx создаёт сам; /tmp переживает reload, но не
# перезагрузку сервера — для трёхсекундного кэша это не важно.
proxy_cache_path /tmp/nginx_api_cache levels=1:2 keys_zone=API_CACHE:10m
                 max_size=100m inactive=1m use_temp_path=off;

# Cache-Control статики, которую nginx отдаёт сам с диска (см. location
# /static/). Значения повторяют CachedStaticFiles в server.py, чтобы поведение
# не зависело от того, кто ответил — nginx или приложение:
#   ?v=…      версионированный файл — год и immutable;
#   .js/.css  без версии — час: i18n.pages.{lang}.js подставляется в HTML без
#             ?v= (seo_pages.render), и неделя кэша заморозила бы переводы;
#   остальное картинки, иконки, шрифты — 7 дней.
# Порядок строк важен: nginx проверяет регулярные выражения по очереди и берёт
# первое совпадение, поэтому «есть ?v=» стоит выше расширений.
map "$arg_v|$uri" $liq_static_cc {
    default                  "public, max-age=604800, no-transform";
    "~^[^|]+[|]"             "public, max-age=31536000, immutable, no-transform";
    "~^[|].*[.]js$"          "public, max-age=3600, no-transform";
    "~^[|].*[.]css$"         "public, max-age=3600, no-transform";
    "~^[|].*[.]json$"        "public, max-age=3600, no-transform";
    "~^[|].*[.]html$"        "public, max-age=3600, no-transform";
    "~^[|].*[.]webmanifest$" "public, max-age=3600, no-transform";
}

upstream liqscope_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name liqscope.online www.liqscope.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://liqscope.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liqscope.online;

    ssl_certificate     /etc/letsencrypt/live/liqscope.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liqscope.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /ws {
        limit_conn liq_ws 20;
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /api/symbols/add {
        limit_req zone=liq_sym burst=10 nodelay;
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------------
    # Микрокэш тяжёлых GET-ручек
    # ---------------------------------------------------------------------
    # Свечи графика: 3 секунды. Ручка отдаёт локальный буфер (биржа грузится
    # фоном), но дёргают её постоянно: терминал — раз в 60 с, каждый
    # embed-график «＋ График» — раз в 15 с. При 50 зрителях это основной
    # поток запросов, и почти все они получают HIT из памяти nginx.
    #
    # add_header в location ОТМЕНЯЕТ наследование серверных заголовков,
    # поэтому блок безопасности ниже повторён — не «убирать дубли».
    location = /api/klines {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # В Python идём без gzip: иначе в кэш ляжет тело, сжатое под одного
        # клиента, и уедет другому (в том числе тому, кто gzip не понимает).
        # Сожмёт сам nginx — под Accept-Encoding конкретного клиента.
        proxy_set_header Accept-Encoding "";

        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 3s;
        # 100 одновременных запросов одного графика → в Python уходит один,
        # остальные ждут его и получают готовый ответ из кэша.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Протухшее отдаём сразу, свежее догружается в фоне: биржа может
        # тормозить, а график обязан отвечать.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Ручка публичная и одинаковая для всех (ни пользователя, ни сессии в
        # ответе нет), поэтому кэш общий. Cookie-виджет аналитики (liqscope_vid)
        # в кэш попадать не должен: иначе один vid уедет всем, кто получит HIT.
        # Гость получает vid раньше — с HTML-страницы терминала.
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Статистика шапки, архив дайджестов и выпуски за день: 5 секунд.
    # Перечисляем ручки точно: рядом живут /api/digest/settings, /api/digest/run
    # и /api/admin/* — их кэшировать нельзя (ответ админа уехал бы другому
    # посетителю). «Лидеры» отдельной ручки нет — они приходят внутри
    # /api/stats; ветка leaders оставлена на будущее.
    # Регулярка в кавычках обязательно: без них nginx принимает «{» за начало
    # блока и падает на nginx -t.
    location ~ "^/api/(stats|leaders|digest|digest/today|digest/[0-9]{4}-[0-9]{2}-[0-9]{2})$" {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Дайджест сам шлёт Cache-Control: public, max-age=60 — для браузера он
        # остаётся, а срок кэша nginx держим своим (5 с), иначе ручка зависела
        # бы от заголовка приложения.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------------------
    # Статика напрямую с диска, минуя Python
    # ---------------------------------------------------------------------
    # Путь — WorkingDirectory юнита (deploy/licvid.service) + /static;
    # setup-https.sh подставляет сюда фактический каталог репозитория.
    #
    # Права: рабочий nginx (www-data) должен мочь прочитать каталог, иначе
    # вместо файлов будет 403. На сервере:
    #   chmod o+x /root /root/Licvid && chmod -R o+rX /root/Licvid/static
    # Файла нет (путь другой, сборка не доехала) — уходим в приложение:
    # @static_app ниже отдаст его как раньше.
    location /static/ {
        alias /root/Licvid/static/;
        access_log off;
        try_files $uri @static_app;
        add_header Cache-Control $liq_static_cc always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Запасной путь статики: приложение (CachedStaticFiles) отдаст файл сам и
    # поставит свой Cache-Control — здесь его не переопределяем.
    location @static_app {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://liqscope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
