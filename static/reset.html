<body data-page="reset">
<header class="site-header">
    <a class="brand" href="/">
        <img class="logo" src="/static/logo.png" alt="LiqScope" width="40" height="40">
        <span class="name">LIQSCOPE</span>
        <span class="tag" data-i18n="brand.account">АККАУНТ</span>
    </a>
    <nav class="site-nav">
        <select id="lang-select" class="lang-select" data-lang-select
                aria-label="Language / Язык" title="Language / Язык"></select>
        <a class="btn btn-ghost btn-compact" href="/terminal" data-i18n="auth.terminal_link">⚡ Терминал</a>
        <span id="nav-account"></span>
    </nav>
</header>
<main class="wrap login-box">
    <div class="card">
        <img src="/static/logo.png" alt="" width="72" height="72" style="width:72px;height:72px;margin-bottom:12px">
        <h1 class="page-title" id="reset-title" data-i18n="reset.title">Новый пароль</h1>
        <p class="lead" id="reset-lead" data-i18n="reset.lead">Придумайте пароль для входа в кабинет по почте.</p>

        <form id="reset-form" style="margin-top:16px">
            <label class="field">
                <span data-i18n="reset.label_email">Почта</span>
                <input type="email" id="reset-email" readonly tabindex="-1">
            </label>
            <label class="field">
                <span data-i18n="reset.label_pass">Пароль</span>
                <input type="password" id="reset-pass" autocomplete="new-password"
                       minlength="8" data-i18n-placeholder="reset.ph_pass" placeholder="не короче 8 символов">
            </label>
            <label class="field">
                <span data-i18n="reset.label_pass2">Пароль ещё раз</span>
                <input type="password" id="reset-pass2" autocomplete="new-password"
                       minlength="8" data-i18n-placeholder="reset.ph_pass2" placeholder="повторите">
            </label>
            <button type="submit" class="btn btn-primary" id="reset-submit"
                    data-i18n="reset.submit">Сохранить пароль</button>
        </form>
        <p class="login-status" id="reset-status"></p>
        <p class="lead" style="margin-top:18px;font-size:0.78rem" data-i18n="reset.note">
            Пароль хранится только в виде хеша: после сохранения сменённый пароль
            знаете лишь вы. Забыли — снова «Забыли пароль?» на странице входа.
        </p>
    </div>
</main>
